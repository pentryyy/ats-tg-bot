[package]
name = "ats-tg-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0.104"
serde_yaml = "0.9.34"
log = "0.4.33"
env_logger = "0.11.11"
teloxide = { version = "0.12", features = ["macros"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "json"] }
chrono = "0.4.45"
serde_json = "1.0.151"
async-trait = "0.1.92"
humantime = "2.4.0"
